<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ege - Kişisel Sayfa</title>
    <style>
        body {
            background-color: #e6f2ff;
            color: #001f4d;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 1.8rem;
            border-bottom: 2px solid #001f4d;
            padding-bottom: 5px;
            margin-top: 30px;
        }
        ul {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 2px solid #001f4d;
            padding: 10px;
            text-align: center;
            font-size: 1rem;
        }
        th {
            background-color: #001f4d;
            color: #e6f2ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ege</h1>
        <p class="subtitle">ÖYG-2 · 2026-2027</p>
        
        <h2>İlgi alanlarım</h2>
        <ul>
            <li>teknoloji</li>
            <li>felsefe</li>
            <li>resim</li>
        </ul>

        <h2>Haftanın Günleri</h2>
        <table>
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Gün</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Pazartesi</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Salı</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Çarşamba</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Perşembe</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>Cuma</td>
                </tr>
                <tr>
                    <td>6</td>
                    <td>Cumartesi</td>
                </tr>
                <tr>
                    <td>7</td>
                    <td>Pazar</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
